name: Markdown quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  markdownlint:
    name: Markdown formatting
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20.0.0
        with:
          globs: "**/*.md"
      - name: Create commit status for Markdown formatting
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: context.payload.check_run.html_url,
              description: 'Markdown formatting check passed',
              context: 'Markdown quality / Markdown formatting'
            });

  link-check:
    name: Markdown links
    runs-on: ubuntu-latest
    needs: markdownlint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Check links
        uses: lycheeverse/lychee-action@v2.4.1
        with:
          args: >-
            --no-progress --exclude-mail
            --exclude '^https://x\.com/DACLabs$'
            --exclude '^https://solscan\.io/token/4m9XHiFaZcoUiMxaJH9DbxSXJXuQuXASw3q35hZPjghb$'
            --exclude '^https://dacnetwork\.io/.*'
            --exclude '^https://dacnetwork\.io/dac-metadata\.json$'
            "./**/*.md"
      - name: Create commit status for Markdown links
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: context.payload.check_run.html_url,
              description: 'Markdown links check passed',
              context: 'Markdown quality / Markdown links'
            });
