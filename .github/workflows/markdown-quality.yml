name: Markdown quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  markdownlint:
    name: Markdown formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20.0.0
        with:
          globs: "**/*.md"
      - name: Create commit status for Markdown formatting
        if: always()
        timeout-minutes: 5
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const checkRunUrl = context.payload.check_run?.html_url || `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: checkRunUrl,
              description: 'Markdown formatting check passed',
              context: 'Markdown quality / Markdown formatting'
            });

  link-check:
    name: Markdown links
    runs-on: ubuntu-latest
    needs: markdownlint
    if: always() && needs.markdownlint.result == 'success'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      # The website CDN returns 403 to Lychee but serves these URLs to curl.
      # Keep them checked here; the exact exclusions below avoid duplicate checks.
      - name: Check website links
        run: |
          for url in \
            'https://dacnetwork.io/' \
            'https://www.dacnetwork.io/' \
            'https://dacnetwork.io/dac-metadata.json'; do
            status=$(curl --silent --show-error --location --fail \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' "$url")
            echo "$url: HTTP $status"
            case "$status" in
              2??) ;;
              *) exit 1 ;;
            esac
          done
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --exclude '^https://(www\.)?dacnetwork\.io/$'
            --exclude '^https://dacnetwork\.io/dac-metadata\.json$'
            --exclude '^https://x\.com/DACLabs$'
            --exclude '^https://solscan\.io/token/4m9XHiFaZcoUiMxaJH9DbxSXJXuQuXASw3q35hZPjghb$'
            --exclude '^https://dacnetwork\.io/.*'
            --exclude '^https://dacnetwork\.io/dac-metadata\.json$'
            "./**/*.md"
      - name: Create commit status for Markdown links
        if: always()
        timeout-minutes: 5
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const checkRunUrl = context.payload.check_run?.html_url || `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: checkRunUrl,
              description: 'Markdown links check passed',
              context: 'Markdown quality / Markdown links'
            });
